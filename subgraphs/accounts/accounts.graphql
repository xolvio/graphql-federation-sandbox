extend schema
@link(url: "https://specs.apollo.dev/federation/v2.1",
  import: ["@key", "@shareable", "@tag", "@inaccessible", "@composeDirective", "@requires", "@external"])

type Query {
  accounts: [Account]
  account(billingAccountNumber: String!): Account
}

type Account @shareable @key(fields: "phoneNumber") {
  """billingAccountNumber or ban or accountNumber"""
  billingAccountNumber: ID!
  phoneNumber: ID!
  """
  Uprising Role Assigned at Subscriber/Line Level -
  Ex: AO, AM.
  MOCKED
  """
  role: String
  """
  IAM Role will be provided Subscriber/Line Level
  Ex: PAH,SL,NPAH_P, NPAH_NP, NPAH_R,
  MOCKED
  """
  userRole: String
  """
  Legacy System role value for Subscriber's associated with Account
  Ex: PAH, FULL, Standard, Restricted, No Access
  MOCKED
  """
  systemRole: String
}

type AccountSettings @shareable {
  paperless: Boolean
}

interface BillDetail {
  billingAccountNumber: String!
}

type CurrentBillDetail implements BillDetail @key(fields: "billingAccountNumber") {
  billingAccountNumber: String!
  account: Account
}
