  """
  Type or Name of the block (e.g. simSwap, retailBlock, portOut etc.). FRAUDFLAG_SIMSWAP returned for simSwap set by T-Mobile fraud Management Team.
  Currently supports only SimSwap block at subscriber level, this will be returned if there is block at billing System.
  This will be returned only at subscriber level and will not be returned at account level.FRAUDFLAG_SIMSWAP will not be supported at the set block request to set and unset the block
  """
  blockType: BLOCKTYPEENUM
  """
  The value set for the block type. This will be a boolean value
  """
  blockValue: Boolean
}

