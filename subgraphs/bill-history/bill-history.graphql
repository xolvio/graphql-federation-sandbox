extend schema
  @link(
    url: "https://specs.apollo.dev/federation/v2.5"
    import: ["@key", "@external", "@shareable", "@extends","@requiresScopes"]
  )

directive @Pattern(
  regexp: String! = ".*"
  message: String = "graphql.validation.Pattern.message"
) on ARGUMENT_DEFINITION | INPUT_FIELD_DEFINITION | FIELD_DEFINITION

type Query {
  subscribers(
    billingAccountNumber: ID!
      @Pattern(
        regexp: "^[0-9]{9}$"
        message: "billingAccountNumber must be 9 digits"
      )
    phoneNumbers: [ID!]
  ): AccountSubscribersResponse

  """
  Query supports  phoneNumber as input and provides data returns
    only subset data but not all the subscriber data in phase1
  """
  subscriberByPhoneNumber(
    phoneNumber: ID!
  ): SubscriberResponse

  equipment(
    imei: ID!
      @Pattern(regexp: "^[0-15]{15}$", message: "imei number must be 15 digits")
  ): EquipmentResponse

  subscriberProducts(
    billingAccountNumber: ID!
      @Pattern(
        regexp: "^[0-9]{9}$"
        message: "billingAccountNumber must be 9 digits"
      )
      phoneNumbers: [ID!]
  ): ProductsResponse


}

union AccountSubscribersResponse = Account | AccountError

union EquipmentResponse = Equipment | EquipmentError

union ProductsResponse = TProducts | ProductError

union SubscriberResponse =  Subscriber | SubscriberError


type Account @key(fields: "billingAccountNumber") @key(fields: "phoneNumber"){
  """billingAccountNumber or ban or accountNumber"""
  billingAccountNumber: ID!

  """phoneNumber """
  phoneNumber: ID!
  """
  Uprising Role Assigned at Subscriber/Line Level -
  Ex: AO, AM.
  MOCKED
  """
  role: String
  """
  IAM Role will be provided Subscriber/Line Level
  Ex: PAH,SL,NPAH_P, NPAH_NP, NPAH_R,
  MOCKED
  """
  userRole: String
  """
  Legacy System role value for Subscriber's associated with Account
  Ex: PAH, FULL, Standard, Restricted, No Access
  MOCKED
  """
  systemRole: String
  """
  Subscribers for the given input Ban
  """
  subscribers(billingAccountNumber: ID, phoneNumbers: [ID!]): [Subscriber!]

  """Account Fraud block Details"""
  accountFraudBlocks: [AccountFraudBlock!]

  """Authorized User for the given Account"""
  authorizedUser: [AuthorizedUser]

}


type Subscriber @key(fields: "phoneNumber") { 
  """Subscriber Phone Number, often refered as MSISDN"""
  phoneNumber: ID!

  """Subscriber is a default line, if the account has multiple subscriber
    MOCKED to false
  """
  defaultLine: Boolean
  """
  Uprising Role Assigned at Subscriber/Line Level -
  Ex: AO, AM.
  MOCKED
  """
  role: String
  """
  IAM Role will be provided Subscriber/Line Level
  Ex: PAH,SL,NPAH_P, NPAH_NP, NPAH_R,
  MOCKED
  """
  userRole: String
  """
  The profile that this user can request or be granted a role
  """
  userId: String
  """
  RegistrationStatus from IAM
  """
  registrationStatus: REGISTRATIONSTATUSENUM
  """
  Legacy System role value for Subscriber's associated with Account
  Ex: PAH, FULL, Standard, Restricted, No Access
  MOCKED
  """
  systemRole: String
  """Full Name flatten (first, middle and last name flatten)"""
  nickName: String
  """First name of the individual"""
  firstName: String!
  """Family name of the individual. Contains the non-chosen or inherited name. Also known as last name in the Western context"""
  lastName: String!
  """ Email Address """
  emailAddress: String
  """Status of the Subscriber active/suspended"""
  status: String!
  """Date when the product is set to active"""
  activationDate: String!
  """Subscriber Product"""
  lineType: PRODUCTTYPEENUM
  """Subscriber Has a Scam Block on the line, this value will be set to true else false"""
  scamBlockInd: Boolean
  """Subscriber has Insurance Soc active"""
  protection360Enabled: Boolean
  """Subscriber equipment details"""
  equipment(imei: String): [Equipment!]
  """
  Reason code for statusChangeReason
  Depends on subscriber status.
  """
  statusChangeReason: String
  """Date when the subscriber was suspended."""
  suspensionDate: String
  """Products which are related for subscriber account"""
  products(billingAccountNumber: ID, phoneNumbers: [ID!]): ProductsResponse @shareable
  """Subscriber address Details"""
  address: [SubscriberAddress!]
  """If any error provide this value"""
  reasonCode: String
  """Subscriber Fraud block Details"""
  subscriberFraudBlocks: [SubscriberFraudBlock!]
  """Phone numbers paired to the subscriber's, if any"""
  pairedPhoneNumbers: [String]
}


type AddOns implements IProductCharacterstics{
  """The service level. Valid values - PRODUCT / ACCOUNT / SUBSCRIBER"""
  productLevel: SERVICELEVELENUM
  """The service type - price plan ,AddOn or Optional. Valid values - P - RATE_PLAN / R - REGULAR (Add-on) / O - OPTIONAL / B - BUYONEGETONE / M - REDUCED-PRICE-PLAN / U - REGULAR-OFFER / S - REDUCED-SOC / T - TAX-FEE"""
  productType: SERVICETYPEENUM
  """Service Code"""
  productCode: String
  """The mobile number (MSISDN) associated with the line of service."""
  phoneNumber: ID
  """Soc Seq No"""
  agreementId: String
  """Service Description"""
  productDescription: String
  """Service Group"""
  productGroup: String
  """Recurring charge."""
  recurringCharge: String
  """The date when the service agreement became active."""
  productEffectiveDate: String
  """The date on which the service expires"""
  productExpirationDate: String
  """Valid values: True / False. Indicates if the service is future dated means become effective on a futer date. In case it is future dates, the property will be set to true and will not be calculated within the totals"""
  futureDatedService: Boolean
  """relatedService"""
  relatedService: String
  """relatedServiceId"""
  relatedServiceId: String
  """True / False. Indicates if the service is included within the rate plan"""
  planInclusive: Boolean
  """Product Type."""
  lineType: PRODUCTTYPEENUM
  """Feature code."""
  featureCode: String
  """Indicates if Tax applies on the service charges or not. In case the service will have the tax define as TI in the DB the value will be set to TAX_INCLUSIVE else buy default it will be set to TAX_EXCLUSIVE"""
  taxType: TAXTYPENUM
}

type TProduct {
  """Feature code."""
  ratePlans: [RatePlan]
    """Feature code."""
  addOnProduct: [AddOns]
}

"""The below if for subscriber level products which provides list of products"""
type TProducts {
   """List of products"""
  products: [TProduct]
}

